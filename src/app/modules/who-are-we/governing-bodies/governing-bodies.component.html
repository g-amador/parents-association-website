<app-top-bar></app-top-bar>
<div class="governing-bodies-container">
  <div class="content-container">

    <!-- Function to render contact groups -->
    <ng-container *ngFor="let group of ['direction', 'assembly', 'fiscalCouncil']">
      <h2 class="group-title">{{ 'governing-bodies_page.' + (group === 'fiscalCouncil' ? 'fiscal_council' : group) |
        translate }}</h2>
      <div class="contact-row">
        <ng-container *ngFor="let contact of contacts; let i = index">
          <div *ngIf="isContactMemberOfGroup((group === 'fiscalCouncil' ? 'fiscal_council' : group), contact)"
            class="contact-card" (click)="openEditDialog(contact)">
            <div class="image-container">
              <img [src]="contact.image" alt="Contact Image" width="100">
            </div>
            <div class="contact-details">
              <div *ngIf="contact.role">
                <strong>{{ contact.role | translate }}</strong>
              </div>
              <div *ngIf="contact.name">{{ contact.name }}</div>
            </div>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
